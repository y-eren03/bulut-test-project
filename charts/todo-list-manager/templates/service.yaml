apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-list-manager.fullname" . }}-service
  labels:
    app.kubernetes.io/name: {{ include "todo-list-manager.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "todo-list-manager.name" . }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
