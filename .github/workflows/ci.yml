name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tododb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Lint
      run: |
        # Lint işlemi (örnek olarak black eklenebilir, şimdilik pass)
        echo "Linting passed"

    - name: Run Pytest & Coverage
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/tododb
      run: |
        pytest --cov=src --cov-fail-under=70

    - name: Docker Build
      run: |
        docker build -t todo-list-manager:${{ github.sha }} .

    - name: Minikube Deploy & Smoke Test
      run: |
        # Minikube CI'da doğrudan ayağa kaldırmak zor olabilir ancak konsept olarak:
        echo "Deploying to Kubernetes (Mock)"
        echo "Running Smoke tests (Mock)"
