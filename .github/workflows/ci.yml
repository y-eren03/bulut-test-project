name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tododb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        image: localstack/localstack:2.3.0
        env:
          SERVICES: s3
          DEBUG: 0
        ports:
          - 4566:4566

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Lint
      run: |
        black src tests --check

    - name: Install Playwright Browsers
      run: |
        python -m playwright install chromium --with-deps

    - name: Run Pytest & Coverage
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/tododb
      run: |
        pytest --cov=src --cov-fail-under=70

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Newman
      run: npm install -g newman

    - name: Docker Build
      run: |
        docker build -t todo-list-manager:${{ github.sha }} .

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.14.4

    - name: Deploy Manifest Dry Run
      run: |
        helm lint charts/todo-list-manager
        helm template todo-list-manager charts/todo-list-manager > rendered-manifests.yaml
        test -s rendered-manifests.yaml
        grep -q "kind: Deployment" rendered-manifests.yaml
        grep -q "kind: Service" rendered-manifests.yaml
        grep -q "kind: ConfigMap" rendered-manifests.yaml

    - name: Run Newman Tests & Smoke Test
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/tododb
        S3_ENDPOINT: http://localhost:4566
      run: |
        # Start app in background
        uvicorn src.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        
        # Smoke test via curl
        curl -f http://localhost:8000/health || exit 1
        
        # Run Newman
        newman run postman/collection.json --working-dir .
