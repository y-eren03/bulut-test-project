name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build-deploy-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tododb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: black src tests --check

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Pytest with coverage
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/tododb
        run: pytest --cov=src --cov-fail-under=70

      - name: Docker build
        run: docker build -t todo-list-manager:${{ github.sha }} .

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Deploy manifest validation
        run: kubectl apply --dry-run=client -f k8s/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman

      - name: Smoke test with Newman
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/tododb
        run: |
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health
          newman run postman/collection.json
