<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Manager</title>
    <!-- Modern Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-primary: #8b5cf6; /* Violet */
            --accent-secondary: #6366f1; /* Indigo */
            --accent-glow: rgba(139, 92, 246, 0.4);
            --success-color: #10b981; /* Emerald */
            --success-glow: rgba(16, 185, 129, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Arka plan parlama efektleri */
        body::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: -1;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%);
            bottom: -150px;
            right: -150px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, #a78bfa 100%);
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 35px;
            font-weight: 300;
        }

        /* Form Elemanları */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 10px;
            padding: 12px 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        /* Görev Listesi */
        #taskList {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .task {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
            overflow: hidden;
            animation: slideIn 0.4s ease;
        }

        .task:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(139, 92, 246, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .task-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        /* Eylemler ve Butonlar */
        .task-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
            align-items: center;
        }

        .btn-complete {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-complete:hover {
            background: var(--success-color);
            color: #fff;
            box-shadow: 0 0 12px var(--success-glow);
        }

        .btn-attach {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-attach:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-primary);
        }

        .attachment-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.25);
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
        }

        .attachment-link:hover {
            background: var(--accent-primary);
            color: #fff;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Tamamlanmış Görev Tasarımı */
        .task.completed {
            opacity: 0.6;
            background: rgba(255, 255, 255, 0.01);
            border-color: rgba(255, 255, 255, 0.03);
        }

        .task.completed .task-title {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .task.completed::before {
            content: "✓ Tamamlandı";
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Animasyonlar */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobil Uyum */
        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>To-Do List Manager</h1>
        <div class="subtitle">Bulut Mimarilerinde Test Mühendisliği Dönem Projesi</div>
        
        <div class="form-group">
            <input type="text" id="taskTitle" placeholder="Görev Başlığı (Zorunlu)">
            <input type="text" id="taskDesc" placeholder="Görev Açıklaması (Opsiyonel)">
            <button class="btn-add" onclick="addTask()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Ekle
            </button>
        </div>

        <div id="taskList">
            <!-- Görevler buraya JS ile yüklenecek -->
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000";

        async function fetchTasks() {
            try {
                const res = await fetch(`${API_URL}/tasks`);
                const tasks = await res.json();
                const list = document.getElementById("taskList");
                list.innerHTML = "";
                
                tasks.forEach(task => {
                    const div = document.createElement("div");
                    div.className = "task";
                    if (task.is_completed) div.classList.add("completed");
                    
                    div.innerHTML = `
                        <div class="task-header">
                            <div class="task-content">
                                <div class="task-title">${task.title}</div>
                                ${task.description ? `<div class="task-desc">${task.description}</div>` : ''}
                            </div>
                        </div>
                        <div class="task-actions">
                            ${!task.is_completed ? `<button class="btn-complete" onclick="completeTask(${task.id})">Tamamla</button>` : ''}
                            
                            <!-- Gizli Dosya Girişi -->
                            <input type="file" id="file-${task.id}" style="display:none" onchange="uploadAttachment(${task.id})">
                            <button class="btn-attach" onclick="document.getElementById('file-${task.id}').click()">📎 Dosya Ekle</button>
                            
                            ${task.attachment_url ? `
                                <a href="${task.attachment_url}" target="_blank" class="attachment-link">
                                    👁️ Eki Görüntüle
                                </a>
                            ` : ''}
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                console.error("Görevler yüklenirken hata oluştu:", err);
            }
        }

        async function addTask() {
            const title = document.getElementById("taskTitle").value;
            const desc = document.getElementById("taskDesc").value;
            if (!title) return alert("Görev başlığı girmek zorunludur!");

            try {
                await fetch(`${API_URL}/tasks?title=${encodeURIComponent(title)}&description=${encodeURIComponent(desc)}`, {
                    method: "POST"
                });
                
                document.getElementById("taskTitle").value = "";
                document.getElementById("taskDesc").value = "";
                fetchTasks();
            } catch (err) {
                console.error("Görev eklenirken hata oluştu:", err);
                alert("Görev eklenemedi!");
            }
        }

        async function completeTask(id) {
            try {
                await fetch(`${API_URL}/tasks/${id}/complete`, { method: "PUT" });
                fetchTasks();
            } catch (err) {
                console.error("Görev tamamlanırken hata oluştu:", err);
                alert("Görev tamamlanamadı!");
            }
        }

        async function uploadAttachment(id) {
            const fileInput = document.getElementById(`file-${id}`);
            if (!fileInput.files || fileInput.files.length === 0) return;
            
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            
            // UI yükleme bildirim durumu
            const attachBtn = fileInput.nextElementSibling;
            const originalText = attachBtn.innerText;
            attachBtn.innerText = "⏳ Yükleniyor...";
            attachBtn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/tasks/${id}/attachment`, {
                    method: "POST",
                    body: formData
                });
                if (res.ok) {
                    alert("Dosya başarıyla S3'e (LocalStack) yüklendi ve göreve eklendi!");
                    fetchTasks();
                } else {
                    alert("S3 yükleme işlemi başarısız!");
                    attachBtn.innerText = originalText;
                    attachBtn.disabled = false;
                }
            } catch (err) {
                console.error("Attachment yükleme hatası:", err);
                alert("Yükleme sırasında teknik bir hata oluştu!");
                attachBtn.innerText = originalText;
                attachBtn.disabled = false;
            }
        }

        // Sayfa yüklendiğinde görevleri çek
        window.onload = fetchTasks;
    </script>
</body>
</html>
